<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>王文卓 · 个人作品集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="viewport">
    <header class="header">
      <a class="brand" href="#top" aria-label="回到首页">
        <span class="brand-mark" aria-hidden="true">W</span>
        <div class="meta">
          <h1 class="name" data-profile="name"></h1>
          <p class="brand-en">WANG WENZHUO</p>
        </div>
      </a>
      <nav class="nav" aria-label="主导航" data-navigation></nav>
    </header>

    <main class="container" id="main" data-content></main>

    <div id="detailModal" class="modal" aria-hidden="true">
      <div class="modal-panel" role="dialog" aria-modal="true">
        <button class="modal-close" aria-label="关闭">✕</button>
        <div class="modal-content"></div>
      </div>
    </div>

    <footer class="footer">
      <small data-profile="footer"></small>
    </footer>
  </div>

  <script src="./resume-data.js"></script>
  <script src="./script.js" defer></script>

</html>
