<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>王文卓 — 产品设计师 / 珠宝品牌创业者</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="viewport">
    <header class="header">
      <div class="brand">
        <img class="avatar" data-profile="avatar" alt="">
        <div class="meta">
          <h1 class="name" data-profile="name"></h1>
          <p class="role" data-profile="role"></p>
        </div>
      </div>
      <nav class="nav" aria-label="主导航" data-navigation></nav>
    </header>

    <main class="container" id="main" data-content></main>

    <div id="detailModal" class="modal" aria-hidden="true">
      <div class="modal-panel" role="dialog" aria-modal="true">
        <button class="modal-close" aria-label="关闭">✕</button>
        <div class="modal-content"></div>
      </div>
    </div>

    <footer class="footer">
      <small data-profile="footer"></small>
    </footer>
  </div>

  <script src="./resume-data.js"></script>
  <script src="./script.js" defer></script>
</body>
</html>
